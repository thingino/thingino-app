org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Native dependencies from thingino-dfu: libtdfu_jni.so plus the bootstrap
# blobs. Produced by that repo's scripts/build-android-deps.sh and published on
# its releases.
#
# tdfuDepsFile wins when set, so you can build against an unreleased libtdfu:
#   ./gradlew assembleDebug -PtdfuDepsFile=../thingino-dfu/dist/thingino-dfu-android-deps-1.5.35.tar.gz
tdfuDepsVersion=1.5.35
tdfuDepsFile=../thingino-dfu/dist/thingino-dfu-android-deps-1.5.35.tar.gz
