org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Native dependencies from thingino-dfu-rs: libtdfu_jni.so plus the bootstrap
# blobs. Produced by that repo's `cargo xtask package --target android` and
# published on its releases.
#
# By default the pinned release is downloaded. To build against an unreleased
# libtdfu, run `cargo xtask package --target android` in a thingino-dfu-rs checkout
# and pass the tarball, which takes priority over the download:
#
#   ./gradlew assembleDebug \
#     -PlibtdfuFile=../thingino-dfu-rs/dist/libtdfu-android-2.0.1.tar.gz
libtdfuVersion=2.0.1
