org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Native dependencies from thingino-dfu: libtdfu_jni.so plus the bootstrap
# blobs. Produced by that repo's scripts/build-android-deps.sh and published on
# its releases.
#
# By default the pinned release is downloaded. To build against an unreleased
# libtdfu, run scripts/build-android-deps.sh in a thingino-dfu checkout and pass
# the tarball, which takes priority over the download:
#
#   ./gradlew assembleDebug \
#     -PtdfuDepsFile=../thingino-dfu/dist/thingino-dfu-android-deps-1.5.35.tar.gz
tdfuDepsVersion=1.5.35
